<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum — PCM & IOQM Planner</title>
<style>
:root {
  --canvas: light-dark(#f5f6f2, #101311);
  --panel: light-dark(#ffffff, #191d1a);
  --panel-soft: light-dark(#f9faf7, #202521);
  --text: light-dark(#1b241f, #eef4ee);
  --muted: light-dark(#707a73, #a1aca4);
  --line: light-dark(#e4e9e2, #303832);
  --accent: light-dark(#26684d, #87d4ae);
  --accent-strong: light-dark(#174d36, #b1efd0);
  --accent-soft: light-dark(#e1f2e8, #20392c);
  --blue: light-dark(#4266a8, #a7c3ff);
  --blue-soft: light-dark(#e9effc, #232e45);
  --amber: light-dark(#98631e, #f4cc87);
  --amber-soft: light-dark(#fbf0dc, #41331f);
  --red: light-dark(#a64e46, #ffaaa2);
  --red-soft: light-dark(#fbe9e7, #432726);
  --shadow: 0 10px 35px rgba(20,35,25,.055);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
#app { min-height: 100vh; width: 100%; background-color: var(--canvas); }
.shell { display: grid; grid-template-columns: 228px minmax(0,1fr); min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 24px 14px 18px; display:flex; flex-direction:column; gap:24px; }
.brand { display:flex; align-items:center; gap:11px; padding: 0 11px; }
.brand-mark { width:36px; height:36px; border-radius:12px; background:var(--accent); color:white; display:grid; place-items:center; font-weight:900; font-size:18px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1); }
.brand-name { font-size:16px; font-weight:800; letter-spacing:-.5px; }
.brand-sub { color:var(--muted); font-size:11px; margin-top:1px; }
.nav-label { padding:0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; font-size:10px; font-weight:800; margin-bottom:6px; }
.nav { display:flex; flex-direction:column; gap:4px; }
.nav-btn { border:0; width:100%; text-align:left; color:var(--muted); display:flex; gap:12px; align-items:center; background:transparent; padding:11px 12px; border-radius:10px; font-weight:650; transition:background .15s,color .15s; }
.nav-btn .ico { width:22px; text-align:center; font-size:16px; }
.nav-btn:hover { background:var(--panel-soft); color:var(--text); }
.nav-btn.active { background:var(--accent-soft); color:var(--accent-strong); }
.sidebar-bottom { margin-top:auto; }
.sidebar-note { padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--panel-soft); }
.sidebar-note strong { display:block; font-size:12px; margin-bottom:3px; }
.sidebar-note p { font-size:11px; color:var(--muted); margin:0; }
.main { min-width:0; }
.topbar { height:72px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:0 34px; background:color-mix(in srgb, var(--canvas) 88%, transparent); }
.crumb { color:var(--muted); font-size:12px; }
.top-actions { display:flex; gap:9px; align-items:center; }
.icon-btn { border:1px solid var(--line); color:var(--text); background:var(--panel); border-radius:10px; width:38px; height:38px; display:grid; place-items:center; }
.primary { color:#fff; background:#246348; border:1px solid #246348; font-weight:750; border-radius:10px; padding:10px 15px; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .12s, opacity .12s; }
.primary:hover { transform:translateY(-1px); }
.secondary { color:var(--text); background:var(--panel); border:1px solid var(--line); font-weight:650; border-radius:10px; padding:9px 13px; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
.ghost { border:0; background:transparent; color:var(--muted); border-radius:8px; padding:6px 8px; }
.ghost:hover { background:var(--panel-soft); color:var(--text); }
.content { max-width:1440px; margin:0 auto; padding:30px 34px 46px; }
.page-header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; }
.eyebrow { color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; }
h1 { letter-spacing:-1.4px; font-size:31px; line-height:1.12; margin:0; font-weight:800; }
h2 { font-size:16px; letter-spacing:-.3px; margin:0; font-weight:800; }
h3 { font-size:14px; margin:0; font-weight:780; }
.subhead { color:var(--muted); margin-top:7px; font-size:13px; }
.grid { display:grid; gap:16px; }
.metrics { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:17px; padding:20px; box-shadow:var(--shadow); min-width:0; }
.metric-top { display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-size:12px; font-weight:650; }
.metric-icon { display:grid; place-items:center; width:33px; height:33px; border-radius:11px; background:var(--panel-soft); color:var(--accent); font-size:15px; }
.metric-number { font-size:29px; font-weight:850; letter-spacing:-1.2px; margin:14px 0 4px; line-height:1.1; }
.metric-foot { font-size:11px; color:var(--muted); }
.good { color:var(--accent); font-weight:800; }
.main-grid { grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr); align-items:start; }
.card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:15px; }
.card-head p { font-size:12px; color:var(--muted); margin:4px 0 0; }
.tag { display:inline-flex; align-items:center; gap:5px; border-radius:30px; background:var(--panel-soft); border:1px solid var(--line); color:var(--muted); font-size:10px; font-weight:800; padding:5px 8px; white-space:nowrap; }
.tag.green { background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
.tag.amber { background:var(--amber-soft); color:var(--amber); border-color:transparent; }
.tag.blue { background:var(--blue-soft); color:var(--blue); border-color:transparent; }
.progress-track { width:100%; height:7px; overflow:hidden; border-radius:99px; background:var(--line); }
.progress-fill { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.schedule-list { display:flex; flex-direction:column; }
.schedule-row { display:grid; grid-template-columns:78px 13px minmax(0,1fr); gap:9px; padding:11px 0; border-bottom:1px solid var(--line); align-items:start; }
.schedule-row:last-child { border-bottom:0; }
.schedule-time { font-size:11px; color:var(--muted); font-weight:700; padding-top:2px; }
.schedule-dot { height:10px; width:10px; background:var(--accent); border-radius:50%; margin-top:5px; box-shadow:0 0 0 4px var(--accent-soft); }
.schedule-row.done .schedule-dot { background:var(--muted); box-shadow:0 0 0 4px var(--panel-soft); }
.schedule-row.done .schedule-name { color:var(--muted); text-decoration:line-through; }
.schedule-name { font-weight:750; font-size:12px; }
.schedule-desc { font-size:11px; color:var(--muted); margin-top:3px; }
.schedule-action { margin-left:auto; align-self:center; }
.task-check { width:17px; height:17px; accent-color:var(--accent); vertical-align:middle; cursor:pointer; }
.timer-card { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 20%, var(--line)); }
.timer-face { text-align:center; font-size:46px; line-height:1.2; font-weight:850; letter-spacing:-2px; font-variant-numeric:tabular-nums; margin:10px 0 4px; }
.timer-mode { text-align:center; text-transform:uppercase; letter-spacing:1.6px; color:var(--accent-strong); font-size:10px; font-weight:850; }
.timer-subject { width:100%; border:1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius:9px; padding:9px 10px; background:var(--panel); color:var(--text); margin:14px 0 11px; }
.timer-controls { display:flex; gap:8px; }
.timer-controls button { flex:1; }
.preset-row { display:flex; gap:6px; justify-content:center; margin:13px 0 0; }
.preset { padding:6px 10px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--muted); font-size:11px; font-weight:800; }
.preset.selected { background:var(--panel); color:var(--text); border-color:var(--line); }
.task-list { display:flex; flex-direction:column; gap:8px; }
.task-item { border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; gap:11px; align-items:flex-start; background:var(--panel); }
.task-item.complete { opacity:.65; }
.task-item.complete .task-title { text-decoration:line-through; }
.task-content { flex:1; min-width:0; }
.task-title { font-size:12px; font-weight:750; overflow-wrap:anywhere; }
.task-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.task-meta span { font-size:10px; color:var(--muted); }
.task-priority { font-size:9px !important; text-transform:uppercase; letter-spacing:.7px; font-weight:850; }
.task-priority.high { color:var(--red) !important; }
.task-priority.medium { color:var(--amber) !important; }
.task-priority.low { color:var(--muted) !important; }
.task-delete { border:0; background:transparent; color:var(--muted); padding:2px; font-size:16px; }
.task-delete:hover { color:var(--red); }
.empty { border:1px dashed var(--line); border-radius:12px; padding:22px; color:var(--muted); text-align:center; font-size:12px; }
.callout { border-radius:13px; background:var(--amber-soft); color:var(--amber); padding:13px 15px; display:flex; align-items:flex-start; gap:10px; font-size:12px; margin-bottom:16px; }
.callout strong { color:var(--text); display:block; margin-bottom:2px; }
.callout p { margin:0; }
.callout.success { background:var(--accent-soft); color:var(--accent-strong); }
.split-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.split-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field.full { grid-column:1/-1; }
.field label { color:var(--muted); font-size:11px; font-weight:750; }
.field input, .field select, .field textarea { width:100%; min-width:0; border:1px solid var(--line); background:var(--panel-soft); color:var(--text); border-radius:9px; padding:10px 11px; }
.field textarea { resize:vertical; min-height:72px; }
.task-form { margin-bottom:17px; }
.filter-row { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.filter-btn { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:30px; padding:7px 11px; font-size:11px; font-weight:750; }
.filter-btn.active { background:var(--accent-soft); border-color:transparent; color:var(--accent-strong); }
.module-list { display:flex; flex-direction:column; gap:10px; }
.module { border:1px solid var(--line); border-radius:14px; padding:15px; background:var(--panel); }
.module-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.module-name { font-size:13px; font-weight:800; }
.module-meta { font-size:11px; color:var(--muted); margin-top:4px; }
.module-progress { width:106px; flex-shrink:0; }
.module-progress strong { display:block; text-align:right; font-size:11px; margin-bottom:6px; }
.module-topics { color:var(--muted); font-size:11px; margin:11px 0 13px; line-height:1.65; }
.lecture-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.number-stepper { display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:10px; padding:5px; }
.number-stepper button { width:26px; height:26px; border:0; border-radius:6px; background:var(--panel-soft); color:var(--text); }
.number-stepper span { min-width:54px; text-align:center; font-size:11px; font-weight:800; }
.module-expand { margin-top:12px; }
.lecture-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:12px; }
.lecture-chip { border:1px solid var(--line); background:var(--panel-soft); color:var(--muted); text-align:left; border-radius:8px; padding:7px 8px; font-size:10px; }
.lecture-chip.completed { background:var(--accent-soft); border-color:transparent; color:var(--accent-strong); }
.lecture-chip b { display:block; font-size:10px; margin-bottom:2px; }
.week-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
.day-card { border:1px solid var(--line); background:var(--panel); border-radius:13px; padding:11px 9px; min-width:0; }
.day-card.today { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 10%, transparent); }
.day-head { font-size:10px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
.day-date { font-size:20px; font-weight:850; margin:5px 0 10px; letter-spacing:-.6px; }
.day-block { border-radius:7px; padding:7px 6px; margin-bottom:6px; font-size:9px; line-height:1.35; overflow-wrap:anywhere; background:var(--panel-soft); color:var(--muted); }
.day-block.math { background:var(--blue-soft); color:var(--blue); }
.day-block.physics { background:var(--accent-soft); color:var(--accent-strong); }
.day-block.chem { background:var(--amber-soft); color:var(--amber); }
.day-block.ioqm { background:light-dark(#f0e9fc,#332744); color:light-dark(#8058b7,#d1b8ff); }
.day-block.tennis { border:1px dashed var(--line); background:transparent; }
.week-note { margin-top:15px; color:var(--muted); font-size:11px; }
.bar-list { display:flex; flex-direction:column; gap:14px; }
.bar-row { display:grid; grid-template-columns:88px minmax(0,1fr) 52px; gap:10px; align-items:center; }
.bar-label { font-size:11px; font-weight:750; }
.bar-value { text-align:right; color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
.week-bars { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; align-items:end; height:142px; padding-top:12px; }
.week-bar-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:7px; }
.week-bar-track { width:100%; flex:1; background:var(--panel-soft); border-radius:7px; display:flex; align-items:flex-end; overflow:hidden; }
.week-bar-fill { width:100%; min-height:2px; background:var(--accent); border-radius:7px; }
.week-bar-label { color:var(--muted); font-size:10px; }
.week-bar-value { font-size:10px; font-weight:800; }
.setting-row { display:flex; justify-content:space-between; gap:18px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
.setting-row:last-child { border-bottom:0; }
.setting-copy strong { display:block; font-size:12px; }
.setting-copy span { color:var(--muted); display:block; font-size:11px; margin-top:3px; max-width:450px; }
.switch { appearance:none; width:39px; height:23px; background:var(--line); border-radius:99px; position:relative; border:0; flex-shrink:0; }
.switch:checked { background:var(--accent); }
.switch::before { content:""; position:absolute; width:17px; height:17px; border-radius:50%; background:#fff; top:3px; left:3px; transition:transform .15s; box-shadow:0 1px 3px #0002; }
.switch:checked::before { transform:translateX(16px); }
.day-checks { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:7px; }
.day-check { display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 2px; border:1px solid var(--line); background:var(--panel-soft); border-radius:10px; }
.day-check.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
.day-check span { font-size:10px; font-weight:800; }
.day-check small { font-size:9px; color:var(--muted); }
.toast { position:fixed; right:24px; bottom:24px; background:var(--text); color:var(--panel); padding:12px 16px; border-radius:11px; box-shadow:var(--shadow); font-size:12px; font-weight:750; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; z-index:40; }
.toast.show { opacity:1; transform:translateY(0); }
.modal-backdrop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.38); }
.modal { width:min(520px,100%); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 24px 90px rgba(0,0,0,.2); }
.modal-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.modal-close { border:0; background:var(--panel-soft); color:var(--muted); border-radius:8px; width:32px; height:32px; }
.bottom-nav { display:none; }
.muted { color:var(--muted); }
.small { font-size:11px; }
.mt-12 { margin-top:12px; }
.mt-16 { margin-top:16px; }
.mt-20 { margin-top:20px; }
.mb-12 { margin-bottom:12px; }
.flex { display:flex; }
.between { justify-content:space-between; }
.center { align-items:center; }
.gap-8 { gap:8px; }
.hide { display:none !important; }
@media (max-width: 1120px) {
  .shell { grid-template-columns:200px minmax(0,1fr); }
  .content { padding:25px 22px 40px; }
  .topbar { padding:0 22px; }
  .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .week-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media (max-width: 800px) {
  .shell { display:block; }
  .sidebar { display:none; }
  .topbar { height:62px; padding:0 16px; }
  .content { padding:22px 15px 90px; }
  .main-grid, .split-2, .split-3 { grid-template-columns:1fr; }
  .page-header { align-items:flex-start; flex-direction:column; }
  h1 { font-size:28px; }
  .bottom-nav { display:flex; position:fixed; z-index:20; bottom:0; left:0; right:0; padding:7px 7px calc(7px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); justify-content:space-around; gap:2px; }
  .bottom-nav .nav-btn { padding:7px 4px; flex-direction:column; justify-content:center; gap:3px; border-radius:8px; font-size:9px; }
  .bottom-nav .nav-btn .ico { font-size:16px; width:auto; }
  .bottom-nav .nav-btn.active { background:var(--accent-soft); }
  .top-actions .secondary { padding:8px 10px; }
  .week-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .lecture-list { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (max-width: 460px) {
  .metrics { gap:9px; }
  .card { padding:15px; border-radius:14px; }
  .metric-number { font-size:25px; }
  .metric-icon { width:28px; height:28px; }
  .metric-foot { font-size:10px; }
  .form-grid { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .schedule-row { grid-template-columns:64px 12px minmax(0,1fr); gap:7px; }
  .schedule-time { font-size:10px; }
  .lecture-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .bar-row { grid-template-columns:75px minmax(0,1fr) 40px; gap:7px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const STORE_KEY = 'momentum-planner-v1';
  const today = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const SHORT_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const SUBJECTS = ['Mathematics','Physics','Chemistry','IOQM','Schoolwork','Revision'];
  const WEEK_PLAN = {
    Monday: {a:['Mathematics','Concepts and worked examples'],b:['Physics','Theory, derivations and numericals'],c:['IOQM','Recall one technique or solve a short set']},
    Tuesday: {a:['IOQM','Practice from the most recent lecture'],b:['Chemistry','Concepts, equations and questions'],c:['Mathematics','Short recall set or homework']},
    Wednesday: {a:['Physics','Conceptual problems and numerical practice'],b:['Mathematics','Proofs and independent problem-solving'],c:['IOQM','Review errors or doubts']},
    Thursday: {a:['Mathematics','Olympiad problems or current chapter'],b:['Chemistry','Written exercises and active recall'],c:['IOQM','Prepare questions for the lecture']},
    Friday: {a:['IOQM','Problem-solving or lecture catch-up'],b:['Revision','Alternate Physics and Chemistry by need'],c:['Schoolwork','Close small backlogs; no huge new task']},
    Saturday: {a:['IOQM','Timed problem set and analysis'],b:['Physics','Or Chemistry: choose the weaker subject'],c:['Weekly review','List errors and prepare for next week']},
    Sunday: {a:['Revision','Review this week’s mistake notebook'],b:['PCM','One light block on the weakest topic'],c:['Planning','Plan next week, then keep the day open']}
  };
  const MODULES = [
    {name:'Basic Mathematics',n:14,start:'15 Oct 2026',end:'14 Nov 2026',topics:'Identities; factorisation and Simon’s Favourite Factoring Technique; inequalities; wavy-curve method; irrational inequalities; modulus; exponents, powers and logarithms.'},
    {name:'Algebra-1: Polynomials + Quadratic',n:10,start:'17 Nov 2026',end:'8 Dec 2026',topics:'Polynomial types; quadratic equations; equation vs identity; Vieta’s relations; symmetric functions; nature of roots; rational/integer root theorem; irreducibility; common roots; graph and range of quadratics; Newton’s theorem.'},

  function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dateLabel(d){ return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }

  function minutesThisWeek(){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-start.getDay());const end=new Date(start);end.setDate(start.getDate()+7);return state.logs.filter(l=>{const d=new Date(l.date+'T12:00:00');return d>=start&&d<end;}).reduce((s,l)=>s+(Number(l.minutes)||0),0);}

  function scheduleRow(b,index){const key=`${dayKey()}-${b[3]}-${index}`;const done=!!(state.daily[key]);return `<div class="schedule-row ${done?'done':''}"><div class="schedule-time">${b[0]}</div><div class="schedule-dot"></div><div><div class="flex between center gap-8"><div class="schedule-name">${esc(b[1])}</div>${['a','b','c','live','recording'].includes(b[3])?`<label class="schedule-action"><input class="task-check" type="checkbox" data-action="toggle-schedule" data-key="${key}" ${done?'checked':''} aria-label="Mark ${esc(b[1])} complete"></label>`:''}</div><div class="schedule-desc">${esc(b[2])}</div></div></div>`;}
  function timerCard(){return `<section class="card timer-card"><div class="card-head"><div><h2>Focus room</h2><p>A single task. One clear finish line.</p></div><span class="tag green">${timer.running?'IN SESSION':'READY WHEN YOU ARE'}</span></div><div class="timer-mode">${timer.mode==='focus'?'Focus session':'Recovery break'}</div><div id="timer-display" class="timer-face">${formatTimer(timer.remaining)}</div><div class="small muted" style="text-align:center">${timer.mode==='focus'?'Keep one tab open. Work until the timer ends.':'Step away from your desk.'}</div>${timer.mode==='focus'?`<select id="timer-subject" class="timer-subject" aria-label="Focus subject">${SUBJECTS.map(s=>`<option ${timer.subject===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<div class="timer-controls"><button class="primary" data-action="timer-toggle">${timer.running?'Ⅱ Pause':'▶ Start focus'}</button><button class="secondary" data-action="timer-reset">↺ Reset</button></div><div class="preset-row"><button class="preset ${timer.initial===25*60?'selected':''}" data-action="preset" data-minutes="25">25 / 5</button><button class="preset ${timer.initial===50*60?'selected':''}" data-action="preset" data-minutes="50">50 / 10</button><button class="preset" data-action="open-log">＋ Log time</button></div></section>`;}
  function taskHtml(t){return `<div class="task-item ${t.done?'complete':''}"><input class="task-check" type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''} aria-label="Complete ${esc(t.title)}"><div class="task-content"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="tag ${t.subject==='IOQM'?'blue':t.subject==='Physics'?'green':t.subject==='Chemistry'?'amber':''}">${esc(t.subject)}</span><span>${esc(t.type||'Practice')}</span><span>${Number(t.minutes)||30} min</span>${t.due?`<span>Due ${t.due===dayKey()?'today':shortDate(new Date(t.due+'T12:00:00'))}</span>`:''}<span class="task-priority ${t.priority||'medium'}">${esc(t.priority||'medium')} priority</span></div></div><button class="task-delete" data-action="delete-task" data-id="${t.id}" title="Delete task" aria-label="Delete task">×</button></div>`;}
  function recentTaskPanel(){const tasks=state.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4);return `<section class="card"><div class="card-head"><div><h2>Next actions</h2><p>Keep the queue small and achievable.</p></div><button class="ghost" data-page="tasks">All tasks →</button></div>${tasks.length?`<div class="task-list">${tasks.map(taskHtml).join('')}</div>`:`<div class="empty">No pending tasks. Add one specific next action to get started.</div>`}<button class="secondary" style="width:100%;margin-top:12px" data-action="open-add-task">＋ Add a task</button></section>`;}

  function todayPage(){const day=DAY_NAMES[new Date().getDay()];const completed=taskDoneToday();const remaining=tasksToday().length;const weekmins=minutesThisWeek();const target=Number(state.settings.dailyStudyTarget)||150;const done=minutesToday();const progress=Math.min(100,Math.round(done/target*100));return `<div class="page-header"><div><div class="eyebrow">${dateLabel(new Date())}</div><h1>Make progress, not pressure.</h1><div class="subhead">A focused plan for today. Leave room for recovery.</div></div><div class="flex gap-8"><button class="secondary" data-page="week">View week ↗</button><button class="primary" data-action="open-add-task">＋ New task</button></div></div>${lectureNotice()}<div class="grid metrics">${metric('Focused today',`${Math.floor(done/60)}h ${done%60}m`,`${progress}% of ${target} min target`,'◷')}${metric('Focused this week',`${Math.floor(weekmins/60)}h ${weekmins%60}m`,'Minutes from completed focus sessions','↗')}${metric('Tasks completed today',String(completed),`${remaining} open due today / unscheduled`,'✓')}${metric('IOQM lectures',`${countCompletedLectures()} / ${allLectureCount()}`,`${Math.round(countCompletedLectures()/allLectureCount()*100)}% lecture tracker progress`,'◇')}</div><div class="grid main-grid"><section class="card"><div class="card-head"><div><h2>Today’s rhythm</h2><p>${day} · Study blocks fit around your fixed tennis session.</p></div><span class="tag">2–3 focused blocks</span></div><div class="schedule-list">${scheduleForToday().map(scheduleRow).join('')}</div><div class="mt-16"><div class="flex between center small"><span class="muted">Daily focus target</span><strong>${done} / ${target} min</strong></div><div class="progress-track mt-12"><div class="progress-fill" style="width:${progress}%"></div></div></div></section><div class="grid" style="gap:16px">${timerCard()}${recentTaskPanel()}</div></div><div class="grid split-2 mt-16"><section class="card"><div class="card-head"><div><h2>Quick check-in</h2><p>Scale the   function weekPage(){const start=dateOffset(-new Date().getDay());const days=Array.from({length:7},(_,i)=>dateOffset(i-new Date().getDay()));const blocks=[['3:00–4:05','a'],['4:20–5:20','b'],['5:40–6:20','c']];return `<div class="page-header"><div><div class="eyebrow">Repeatable, not rigid</div><h1>Your weekly plan</h1><div class="subhead">Every day includes tennis from 7:00–8:15 PM. Shift study blocks when school deadlines require it.</div></div><button class="primary" data-action="open-add-task">＋ Plan a task</button></div><div class="callout success"><span>✓</span><div><strong>Base routine</strong><p>Recover after school → two deep-work blocks → short consolidation → tennis → dinner and wind-down. Tuesday, Thursday and Saturday batch lectures are set to recording mode by default to avoid forcing late nights.</p></div></div><div class="week-grid">${days.map(d=>{const day=DAY_NAMES[d.getDay()],p=WEEK_PLAN[day],isToday=iso(d)===dayKey();return `<div class="day-card ${isToday?'today':''}"><div class="day-head">${SHORT_DAYS[d.getDay()]} ${isToday?'· TODAY':''}</div><div class="day-date">${d.getDate()}</div><div class="day-block ${p.a[0]==='Mathematics'?'math':p.a[0]==='Physics'?'physics':p.a[0]==='Chemistry'?'chem':p.a[0]==='IOQM'?'ioqm':''}"><b>3:00</b><br>${esc(p.a[0])}</div><div class="day-block ${p.b[0]==='Mathematics'?'math':p.b[0]==='Physics'?'physics':p.b[0]==='Chemistry'?'chem':p.b[0]==='IOQM'?'ioqm':''}"><b>4:20</b><br>${esc(p.b[0])}</div><div class="day-block ${p.c[0]==='Mathematics'?'math':p.c[0]==='Physics'?'physics':p.c[0]==='Chemistry'?'chem':p.c[0]==='IOQM'?'ioqm':''}"><b>5:40</b><br>${esc(p.c[0])}</div><div class="day-block tennis"><b>7:00–8:15</b><br>🎾 Tennis</div>${[2,4,6].includes(d.getDay())?`<div class="day-block ioqm"><b>8:30 PM</b><br>IOQM ${state.settings.lectureMode==='live'?'live':'recording queue'}</div>`:''}</div>`;}).join('')}</div><div class="week-note">The weekday subject rotation is a starting template, not a fixed quota. If you miss a   function subjectBars(){const targets={Mathematics:180,Physics:120,Chemistry:120,IOQM:180,Schoolwork:90,Revision:60};return `<div class="bar-list">${Object.entries(targets).map(([s,t])=>{const used=state.logs.filter(l=>l.subject===s&&weekDate(l.date)).reduce((sum,l)=>sum+l.minutes,0);return `<div class="bar-row"><div class="bar-label">${s}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,used/t*100)}%"></div></div><div class="bar-value">${used}/${t}m</div></div>`;}).join('')}</div><p class="small muted mt-16">Weekly targets are adjustable starting points. Do not treat missed targets as debt to repay.</p>`;}

s="metric-icon">✓</div><div class="task-content"><div class="task-title">Weak: “Do IOQM”</div><div class="schedule-desc">Strong: “Attempt 4 number-theory problems; write why each failed attempt failed.”</div></div></div></div></section>${timerCard()}</div>`;}
  function moduleHtml(m,i){const done=completedLectureCount(i);const expanded=state.expandedModule===i;return `<div class="module"><div class="module-top"><div><div class="module-name">${String(i+1).padStart(2,'0')} · ${esc(m.name)}</div><div class="module-meta">${m.n} lectures · ${m.start} – ${m.end}</div></div><div class="module-progress"><strong>${done}/${m.n}</strong><div class="progress-track"><div class="progress-fill" style="width:${done/m.n*100}%"></div></div></div></div><div class="module-topics">${esc(m.topics)}</div>${m.note?`<div class="callout" style="margin:0 0 12px;padding:10px"><span>!</span><div>${esc(m.note)}</div></div>`:''}<div class="lecture-controls"><button class="secondary" data-action="expand-module" data-index="${i}">${expanded?'Hide lecture checklist':'Track lectures'} ${expanded?'↑':'↓'}</button><button class="ghost" data-action="complete-module" data-index="${i}">Mark all complete</button><button class="ghost" data-action="reset-module" data-index="${i}">Reset</button></div>${expanded?`<div class="lecture-list">${Array.from({length:m.n},(_,j)=>{const p=ensureLectureArray(i);return `<button class="lecture-chip ${p[j]?'completed':''}" data-action="toggle-lecture" data-index="${i}" data-lecture="${j}" aria-pressed="${!!p[j]}"><b>Lecture ${j+1}</b>${p[j]?'✓ Completed':'Mark complete'}</button>`;}).join('')}</div>`:''}</div>`;}
  function ioqmPage(){const done=countCompletedLectures(),total=allLectureCount();return `<div class="page-header"><div><div class="eyebrow">Your batch, in one place</div><h1>IOQM 2027 tracker</h1><div class="subhead">Track lectures and pair every lecture with independent problem-solving.</div></div><button class="secondary" data-action="download-data">↓ Export data</button></div><div class="grid metrics">${metric('Lectures complete',`${done}/${total}`,`${Math.round(done/total*100)}% of listed lectures`,'◇')}${metric('Modules',String(MODULES.length),'Across the course planner','▦')}${metric('IOQM focus time',`${Math.floor(minutesForSubject('IOQM')/60)}h ${minutesForSubject('IOQM')%60}m`,'Total time you have logged','◷')}${metric('Problem sessions',String(state.logs.filter(l=>l.subject==='IOQM').length),'Logged IOQM focus blocks','✎')}</div><div class="callout success"><span>↗</span><div><strong>Lecture completion is only the first metric</strong><p>For each concept, try problems without notes, record failed approaches, and revisit questions after a few days. Use your focus timer to log real problem-solving time.</p></div></div><section class="card"><div class="card-head"><div><h2>Course roadmap</h2><p>Lecture counts, topic coverage and completion checklist from your uploaded planner.</p></div><span class="tag green">${total} lectures</span></div><div class="module-list">${MODULES.map(moduleHtml).join('')}</div><p class="small muted mt-16">The lecture checklist tracks completion only; individual lecture topics are summarized at module level. Use your course portal for any updated class dates.</p></section>`;}
  function insightsPage(){const total=minutesThisWeek();const target=Number(state.settings.dailyStudyTarget)||150;const days=Array.from({length:7},(_,i)=>dateOffset(i-new Date().getDay()));const vals=days.map(d=>state.logs.filter(l=>l.date===iso(d)).reduce((s,l)=>s+l.minutes,0));const max=Math.max(60,...vals);return `<div class="page-header"><div><div class="eyebrow">Feedback, not judgement</div><h1>Insights & consistency</h1><div class="subhead">Use the data to adjust the plan, not to punish yourself for missed targets.</div></div></div><div class="grid metrics">${metric('This week',`${Math.floor(total/60)}h ${total%60}m`,'Logged focused minutes','◷')}${metric('Focus sessions',String(state.logs.filter(l=>weekDate(l.date)).length),'Completed timer or manual logs','↗')}${metric('Tasks completed',String(state.tasks.filter(t=>t.done).length),'Across all dates','✓')}${metric('IOQM progress',`${Math.round(countCompletedLectures()/allLectureCount()*100)}%`,'Lectures marked complete','◇')}</div><div class="grid split-2"><section class="card"><div class="card-head"><div><h2>Daily focus</h2><p>Minutes recorded this week</p></div><span class="tag">${total} min</span></div><div class="week-bars">${days.map((d,i)=>`<div class="week-bar-col"><div class="week-bar-value">${vals[i]||''}</div><div class="week-bar-track"><div class="week-bar-fill" style="height:${vals[i]/max*100}%"></div></div><div class="week-bar-label">${SHORT_DAYS[d.getDay()]}</div></div>`).join('')}</div><p class="small muted mt-16">Log sessions consistently to make the trend useful. A low day is information, not failure.</p></section><section class="card"><div class="card-head"><div><h2>Time by subject</h2><p>All logged focus time</p></div></div>${subjectBarsAll()}<button class="secondary mt-16" data-action="open-log">＋ Add a past focus session</button></section></div><div class="grid split-2 mt-16"><section class="card"><div class="card-head"><div><h2>Study review</h2><p>Questions for your Sunday review</p></div></div><div class="task-list"><div class="task-item"><div class="metric-icon">1</div><div class="task-content"><div class="task-title">What became easier this week?</div><div class="schedule-desc">Name a concept or problem type, not just a chapter.</div></div></div><div class="task-item"><div class="metric-icon">2</div><div class="task-content"><div class="task-title">Which error repeated?</div><div class="schedule-desc">Change your method or add a targeted drill.</div></div></div><div class="task-item"><div class="metric-icon">3</div><div class="task-content"><div class="task-title">Was the plan too full?</div><div class="schedule-desc">Reduce planned work if sleep, focus or recovery suffered.</div></div></div></div></section><section class="card"><div class="card-head"><div><h2>Data management</h2><p>Keep a copy of your progress.</p></div></div><p class="small muted">Your data is stored locally in this browser. Export a JSON backup before clearing browser data or changing devices.</p><div class="flex gap-8 mt-16"><button class="primary" data-action="download-data">Export backup</button><button class="secondary" data-action="import-data">Import backup</button></div><input type="file" id="import-file" accept="application/json,.json" class="hide"></section></div>`;}
  function subjectBarsAll(){const vals=SUBJECTS.map(s=>[s,minutesForSubject(s)]);const max=Math.max(30,...vals.map(x=>x[1]));return `<div class="bar-list">${vals.map(([s,v])=>`<div class="bar-row"><div class="bar-label">${s}</div><div class="progress-track"><div class="progress-fill" style="width:${v/max*100}%"></div></div><div class="bar-value">${v}m</div></div>`).join('')}</div>`;}
  function settingsPage(){return `<div class="page-header"><div><div class="eyebrow">Tune the system to your real life</div><h1>Settings</h1><div class="subhead">Make the plan fit you. Don't force yourself to fit the plan.</div></div></div><div class="grid split-2"><section class="card"><div class="card-head"><div><h2>Daily schedule</h2><p>Your fixed tennis commitment and study targets.</p></div></div><div class="setting-row"><div class="setting-copy"><strong>Tennis, every day</strong><span>Protected daily session: 7:00–8:15 PM.</span></div><span class="tag green">Daily</span></div><div class="form-grid mt-16"><div class="field"><label for="tennis-start">Tennis starts</label><input type="time" id="tennis-start" value="${esc(state.settings.tennisStart)}"></div><div class="field"><label for="tennis-end">Tennis ends</label><input type="time" id="tennis-end" value="${esc(state.settings.tennisEnd)}"></div><div class="field"><label for="school-end">Home / school day ends</label><input type="time" id="school-end" value="${esc(state.settings.schoolEnd)}"></div><div class="field"><label for="bedtime">Target wind-down / bedtime</label><input type="time" id="bedtime" value="${esc(state.settings.bedtime)}"></div><div class="field full"><label for="daily-target">Daily focused-study target (minutes)</label><input type="number" id="daily-target" min="30" max="360" step="15" value="${Number(state.settings.dailyStudyTarget)||150}"></div><div class="field full"><button class="primary" data-action="save-settings">Save schedule</button></div></div></section><section class="card"><div class="card-head"><div><h2>IOQM live vs recordings</h2><p>The supplied planner places live classes at 8:30–10:00 PM.</p></div></div><label class="task-item" style="cursor:pointer"><input type="radio" name="lecture-mode" value="recording" ${state.settings.lectureMode==='recording'?'checked':''}><div class="task-content"><div class="task-title">Recording-first (recommended)</div><div class="schedule-desc">Protects the post-tennis transition and sleep. Schedule recordings in daytime blocks by replacing, not stacking, other work.</div></div></label><label class="task-item mt-12" style="cursor:pointer"><input type="radio" name="lecture-mode" value="live" ${state.settings.lectureMode==='live'?'checked':''}><div class="task-content"><div class="task-title">Attend live when feasible</div><div class="schedule-desc">Shows the live class on Tuesday, Thursday and Saturday. Check your actual bedtime and next-day obligations.</div></div></label><div class="setting-row"><div class="setting-copy"><strong>Low-energy adjustment</strong><span>When energy is low, recommend one essential block and a short recall session.</span></div><input class="switch" type="checkbox" id="low-energy-switch" ${state.settings.reduceOnLowEnergy?'checked':''}></div><div class="setting-row"><div class="setting-copy"><strong>Workload mode</strong><span>Use a lighter default on weeks with exams or heavy schoolwork.</span></div><select id="workload-mode" style="border:1px solid var(--line);background:var(--panel-soft);color:var(--text);padding:8px;border-radius:9px"><option value="light" ${state.settings.workload==='light'?'selected':''}>Light</option><option value="balanced" ${state.settings.workload==='balanced'?'selected':''}>Balanced</option><option value="challenge" ${state.settings.workload==='challenge'?'selected':''}>Challenge</option></select></div><button class="primary mt-16" data-action="save-settings">Save preferences</button></section></div><div class="grid split-2 mt-16"><section class="card"><div class="card-head"><div><h2>Focus timer</h2><p>Default session and break lengths.</p></div></div><div class="form-grid"><div class="field"><label for="focus-preset">Focus session (minutes)</label><select id="focus-preset"><option value="25" ${Number(state.settings.focusPreset)===25?'selected':''}>25 minutes</option><option value="50" ${Number(state.settings.focusPreset)===50?'selected':''}>50 minutes</option><option value="60" ${Number(state.settings.focusPreset)===60?'selected':''}>60 minutes</option></select></div><div class="field"><label for="rest-preset">Break (minutes)</label><select id="rest-preset"><option value="5" ${Number(state.settings.restPreset)===5?'selected':''}>5 minutes</option><option value="10" ${Number(state.settings.restPreset)===10?'selected':''}>10 minutes</option><option value="15" ${Number(state.settings.restPreset)===15?'selected':''}>15 minutes</option></select></div><div class="field full"><button class="secondary" data-action="save-settings">Save timer preferences</button></div></div></section><section class="card"><div class="card-head"><div><h2>Privacy & reset</h2><p>Local-first storage and portable data.</p></div></div><p class="small muted">This prototype does not need an account. Your tasks, lecture progress and logs are stored in this browser’s local storage. Export before resetting.</p><div class="flex gap-8 mt-16"><button class="secondary" data-action="download-data">Export data</button><button class="secondary" data-action="reset-confirm">Reset app data</button></div></section></div>`;}
  function formatTimer(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
  function currentPage(){switch(state.selectedPage){case'week':return weekPage();case'tasks':return taskPage();case'ioqm':return ioqmPage();case'insights':return insightsPage();case'settings':return settingsPage();default:return todayPage();}}
  function render(){const app=document.getElementById('app');app.innerHTML=`<div class="shell">${sidebar()}<main class="main">${topbar()}<div class="content">${currentPage()}</div></main></div>${bottomNav()}`;const mini=document.getElementById('mini-timer');if(mini)mini.textContent=formatTimer(timer.remaining);if(document.getElementById('timer-subject')) document.getElementById('timer-subject').value=timer.subject;}
  function openModal(title,bodyHtml,footerHtml=''){const back=document.createElement('div');back.className='modal-backdrop';back.id='active-modal';back.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-title"><h2>${title}</h2><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div>${bodyHtml}${footerHtml?`<div class="flex gap-8 mt-16" style="justify-content:flex-end">${footerHtml}</div>`:''}</div>`;document.body.appendChild(back);back.addEventListener('click',e=>{if(e.target===back)back.remove();});}
  function openAddTask(){openModal('Add a task',`<form id="task-form"><div class="form-grid"><div class="field full"><label for="task-title">What is the next action?</label><input id="task-title" name="title" required maxlength="120" placeholder="e.g. Solve 6 polynomial-root problems"></div><div class="field"><label for="task-subject">Subject</label><select id="task-subject" name="subject">${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="task-type">Task type</label><select id="task-type" name="type"><option>Concept</option><option selected>Practice</option><option>Revision</option><option>Homework</option><option>Test analysis</option></select></div><div class="field"><label for="task-minutes">Estimated time</label><select id="task-minutes" name="minutes"><option value="15">15 minutes</option><option value="25">25 minutes</option><option value="30" selected>30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label for="task-priority">Priority</label><select id="task-priority" name="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div><div class="field full"><label for="task-due">Due date (optional)</label><input type="date" id="task-due" name="due" value="${dayKey()}"></div></div><div class="flex gap-8 mt-16" style="justify-content:flex-end"><button class="secondary" type="button" data-action="close-modal">Cancel</button><button class="primary" type="submit">Save task</button></div></form>`);setTimeout(()=>document.getElementById('task-title')?.focus(),50);}
  function openLogModal(){openModal('Log a focus session',`<form id="log-form"><div class="form-grid"><div class="field"><label for="log-subject">Subject</label><select id="log-subject" name="subject">${SUBJECTS.map(s=>`<option ${s===timer.subject?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="log-minutes">Minutes focused</label><input id="log-minutes" name="minutes" type="number" min="5" max="360" step="5" value="${timer.mode==='focus'?Math.round(timer.initial/60):30}" required></div><div class="field full"><label for="log-note">What did you work on? (optional)</label><input id="log-note" name="note" maxlength="150" placeholder="e.g. Vieta's relations, Q1–Q6"></div><div class="field full"><label for="log-date">Date</label><input id="log-date" name="date" type="date" value="${dayKey()}" required></div></div><div class="flex gap-8 mt-16" style="justify-content:flex-end"><button class="secondary" type="button" data-action="close-modal">Cancel</button><button class="primary" type="submit">Log session</button></div></form>`);}
  function openTimerModal(){openModal('Focus room',`<div class="timer-mode">${timer.mode==='focus'?'Focus session':'Recovery break'}</div><div class="timer-face" id="modal-timer-display">${formatTimer(timer.remaining)}</div>${timer.mode==='focus'?`<div class="field"><label for="modal-timer-subject">Subject</label><select id="modal-timer-subject">${SUBJECTS.map(s=>`<option ${timer.subject===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}<div class="preset-row"><button class="preset ${timer.initial===25*60?'selected':''}" data-action="preset" data-minutes="25">25 / 5</button><button class="preset ${timer.initial===50*60?'selected':''}" data-action="preset" data-minutes="50">50 / 10</button></div><div class="timer-controls mt-16"><button class="primary" data-action="timer-toggle">${timer.running?'Ⅱ Pause':'▶ Start focus'}</button><button class="secondary" data-action="timer-reset">↺ Reset</button></div><button class="secondary" style="width:100%;margin-top:10px" data-action="open-log">＋ Log a session manually</button>`);}
  function handleAction(el){const action=el.dataset.action;const id=el.dataset.id;const index=Number(el.dataset.index);switch(action){
    case'open-add-task':openAddTask();break;
    case'close-modal':document.getElementById('active-modal')?.remove();break;
    case'open-timer':openTimerModal();break;
    case'open-log':document.getElementById('active-modal')?.remove();openLogModal();break;
    case'timer-toggle':if(timer.running){timer.running=false;showToast('Timer paused. Pick it up when ready.');}else{timer.running=true;timer.startedAt=Date.now();showToast('Focus session started.');}document.getElementById('active-modal')?.remove();render();break;
    case'timer-reset':timer.running=false;timer.mode='focus';timer.remaining=(Number(state.settings.focusPreset)||50)*60;timer.initial=timer.remaining;render();break;
    case'preset':timer.running=false;timer.mode='focus';timer.initial=Number(el.dataset.minutes)*60;timer.remaining=timer.initial;state.settings.focusPreset=Number(el.dataset.minutes);state.settings.restPreset=Number(el.dataset.minutes)===25?5:10;save();render();showToast(`Focus preset: ${el.dataset.minutes} minutes.`);break;
    case'toggle-task':{const t=state.tasks.find(t=>t.id===id);if(t){t.done=el.checked;t.completedDate=el.checked?dayKey():null;save();render();showToast(el.checked?'Task completed.':'Task reopened.');}break;}
    case'delete-task':state.tasks=state.tasks.filter(t=>t.id!==id);save();render();showToast('Task deleted.');break;
    case'task-filter':state.selectedTaskFilter=el.dataset.filter;save();render();break;
    case'toggle-schedule':state.daily[el.dataset.key]=el.checked;save();render();break;
    case'energy':state.energy=el.dataset.value;save();render();break;
    case'save-note':state.notes=document.getElementById('daily-note')?.value||'';save();showToast('Small wins note saved.');break;
    case'expand-module':state.expandedModule=state.expandedModule===index?-1:index;save();render();break;
    case'toggle-lecture':setLecture(index,Number(el.dataset.lecture),el.getAttribute('aria-pressed')!=='true');break;
    case'complete-module':state.lectureProgress[index]=Array.from({length:MODULES[index].n},()=>true);save();render();showToast('Module marked complete.');break;
    case'reset-module':state.lectureProgress[index]=Array.from({length:MODULES[index].n},()=>false);save();render();showToast('Module progress reset.');break;
    case'save-settings':saveSettings();break;
    case'download-data':downloadData();break;
    case'import-data':document.getElementById('import-file')?.click();break;
    case'reset-confirm':openModal('Reset all planner data?',`<p class="muted">This deletes tasks, lecture progress, focus logs and settings stored in this browser. Export your data first if you want a backup.</p><div class="flex gap-8 mt-16" style="justify-content:flex-end"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" style="background:var(--red);border-color:var(--red)" data-action="reset-data">Reset everything</button></div>`);break;
    case'reset-data':localStorage.removeItem(STORE_KEY);state=structuredClone(seed);timer={remaining:50*60,running:false,mode:'focus',initial:50*60,subject:'IOQM'};document.getElementById('active-modal')?.remove();render();showToast('Planner reset.');break;
    default:break;
  }}
  function saveSettings(){const get=id=>document.getElementById(id);const gs=get('lecture-mode');const checkedLecture=document.querySelector('input[name="lecture-mode"]:checked');const tennisStart=get('tennis-start'),tennisEnd=get('tennis-end'),schoolEnd=get('school-end'),bedtime=get('bedtime'),daily=get('daily-target'),low=get('low-energy-switch'),workload=get('workload-mode'),focus=get('focus-preset'),rest=get('rest-preset');if(checkedLecture)state.settings.lectureMode=checkedLecture.value;if(tennisStart)state.settings.tennisStart=tennisStart.value;if(tennisEnd)state.settings.tennisEnd=tennisEnd.value;if(schoolEnd)state.settings.schoolEnd=schoolEnd.value;if(bedtime)state.settings.bedtime=bedtime.value;if(daily)state.settings.dailyStudyTarget=Math.max(30,Math.min(360,Number(daily.value)||150));if(low)state.settings.reduceOnLowEnergy=low.checked;if(workload)state.settings.workload=workload.value;if(focus){state.settings.focusPreset=Number(focus.value);timer.initial=Number(focus.value)*60;timer.remaining=timer.initial;timer.running=false;}if(rest)state.settings.restPreset=Number(rest.value);state.timerSubject=timer.subject;save();render();showToast('Preferences saved.');}
  function downloadData(){const blob=new Blob([JSON.stringify({app:'Momentum PCM & IOQM Planner',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`momentum-planner-${dayKey()}.json`;a.click();URL.revokeObjectURL(url);showToast('Backup exported.');}
  document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get('title')||'').trim();if(!title)return;state.tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,subject:fd.get('subject'),type:fd.get('type'),minutes:Number(fd.get('minutes'))||30,priority:fd.get('priority'),due:fd.get('due')||'',done:false,createdAt:new Date().toISOString()});save();document.getElementById('active-modal')?.remove();state.selectedPage='tasks';render();showToast('Task added to your queue.');}if(e.target.id==='log-form'){e.preventDefault();const fd=new FormData(e.target);const date=String(fd.get('date')||dayKey());const minutes=Math.max(5,Math.min(360,Number(fd.get('minutes'))||0));state.logs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),subject:String(fd.get('subject')||'IOQM'),minutes,date,time:new Date(date+'T12:00:00').toISOString(),note:String(fd.get('note')||'')});save();document.getElementById('active-modal')?.remove();render();showToast('Focus time logged.');}});
  document.addEventListener('click',e=>{const pageEl=e.target.closest('[data-page]');if(pageEl){state.selectedPage=pageEl.dataset.page;save();document.getElementById('active-modal')?.remove();render();return;}const el=e.target.closest('[data-action]');if(el)handleAction(el);});
  document.addEventListener('change',e=>{if(e.target.id==='timer-subject'||e.target.id==='modal-timer-subject'){timer.subject=e.target.value;state.timerSubject=timer.subject;save();}if(e.target.id==='import-file'&&e.target.files[0]){const file=e.target.files[0];const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const incoming=obj.state||obj;if(!incoming||typeof incoming!=='object')throw new Error('Invalid');state={...structuredClone(seed),...incoming,settings:{...seed.settings,...(incoming.settings||{})}};save();render();showToast('Backup imported.');}catch(err){showToast('Could not import that JSON backup.');}};reader.readAsText(file);}});
  setInterval(()=>{if(timer.running){timer.remaining=Math.max(0,timer.remaining-1);const d=document.getElementById('timer-display');const m=document.getElementById('modal-timer-display');const mini=document.getElementById('mini-timer');if(d)d.textContent=formatTimer(timer.remaining);if(m)m.textContent=formatTimer(timer.remaining);if(mini)mini.textContent=formatTimer(timer.remaining);if(timer.remaining===0){timer.running=false;if(timer.mode==='focus'){logSession(timer.subject,timer.initial/60,'Focus timer completed');timer.mode='break';timer.initial=(Number(state.settings.restPreset)||10)*60;timer.remaining=timer.initial;showToast('Focus block complete. Take a real break.');}else{timer.mode='focus';timer.initial=(Number(state.settings.focusPreset)||50)*60;timer.remaining=timer.initial;showToast('Break complete. Return only if you have energy.');}render();}}},1000);
  // Keep the selected page stable and persist the current subject choice.
  document.addEventListener('change',e=>{if(e.target.id==='timer-subject'){timer.subject=e.target.value;state.timerSubject=timer.subject;save();}});
  render();
})();
</script>
</body>
